<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muzaffarpur House Price Predictor</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>🏡 Muzaffarpur Property Valuation Engine</h2>
        <p class="subtitle">AI-Powered Real Estate Estimator (Calibrated Data v3)</p>
        <hr>
        
        <form id="predictionForm">
            <div class="form-group">
                <label for="locality">Select Locality:</label>
                <select id="locality" required>
                    <option value="6">Motijheel (Premium Hub)</option>
                    <option value="5">Club Road</option>
                    <option value="4">Kalyani</option>
                    <option value="3">Mithanpura</option>
                    <option value="2">Kanhauli</option>
                    <option value="1">Sherpur</option>
                    <option value="0" selected>Sabhapur (Budget Tier)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="size">House Size (Square Feet):</label>
                <input type="number" id="size" min="400" max="6000" value="1760" required>
            </div>

            <div class="form-group">
                <label for="bedrooms">Number of Bedrooms (BHK):</label>
                <input type="number" id="bedrooms" min="1" max="6" value="3" required>
            </div>

            <div class="form-group">
                <label for="floors">Total Floors:</label>
                <input type="number" id="floors" min="1" max="4" value="1" required>
            </div>

            <div class="form-group">
                <label for="roadSide">Is it a Road Side Property?</label>
                <select id="roadSide" required>
                    <option value="1">Yes (Heavy Premium)</option>
                    <option value="0" selected>No</option>
                </select>
            </div>

            <button type="button" id="predictBtn">Calculate Estimated Value</button>
        </form>

        <div id="resultContainer" class="result-box hidden">
            <h3>Estimated Price</h3>
            <div id="priceValue" class="price">₹ 0.00</div>
        </div>
    </div>

    <script src="logic.js"></script>
</body>
</html>
